name: Build Android APK

on:
  push:
    branches: [ main, master, mobile-app ]
  pull_request:
    branches: [ main, master, mobile-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Assets & Sync Capacitor
        run: npm run sync

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPuzzle-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update Release with Direct APK Download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mobile-app'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "Block Puzzle Android APK"
          tag_name: "latest-apk"
          make_latest: true
          body: |
            ### Block Puzzle Mobile APK (Android)
            - **100% Offline**: Neural network ONNX engine and WebAssembly runtime bundled locally.
            - **Native Haptics**: Vibration on block placement, clears, and combos.
            - **Mobile View**: Optimized for thumb play and safe area navigation.

            Directly download `app-debug.apk` below and open on your Android phone!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
