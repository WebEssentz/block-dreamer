name: Build Android APK

on:
  push:
    branches: [ main, master, mobile-app ]
  pull_request:
    branches: [ main, master, mobile-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Assets & Sync Capacitor
        run: npm run sync

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPuzzle-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update latest-apk Tag & Read Version
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mobile-app'
        id: meta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-apk
          git push -f origin latest-apk
          VER=$(node -p "require('./version.json').version")
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Create or Update Release with Direct APK Download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mobile-app'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "Block Dreamer v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.sha }})"
          tag_name: "latest-apk"
          target_commitish: "${{ github.ref_name }}"
          make_latest: true
          overwrite_files: true
          body: |
            ### Block Dreamer Android APK — v${{ steps.meta.outputs.version }} (`${{ steps.meta.outputs.sha }}`)
            - **100% Offline**: Neural network ONNX engine and WebAssembly runtime bundled locally.
            - **Live OTA Updates**: Future web/UI updates sync automatically in-app.
            - **Native Haptics & Pause**: Vibration feedback and freeze-safe Pause overlay.

            Directly download `app-debug.apk` below and install on your Android phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
